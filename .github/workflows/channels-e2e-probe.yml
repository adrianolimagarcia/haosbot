name: Temporary Channels E2E Probe

on:
  push:
    branches: [memory-production-hardening]

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require E2E configuration
        env:
          E2E_CONFIG: ${{ secrets.HAOSBOT_CHANNEL_E2E_JSON }}
        run: |
          if [ -z "$E2E_CONFIG" ]; then
            echo "::error::Configure repository secret HAOSBOT_CHANNEL_E2E_JSON with a JSON object keyed by channel id."
            exit 1
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Run live channel smoke tests
        env:
          HAOSBOT_CHANNEL_E2E_JSON: ${{ secrets.HAOSBOT_CHANNEL_E2E_JSON }}
        run: go test -count=1 -timeout 15m ./internal/channels/registry -run '^TestLiveChannelSmokeE2E$' -v
