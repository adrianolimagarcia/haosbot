name: CI

on:
  push:
    branches:
      - main
      - feat/parity-mcp-stdio-lifecycle
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Two steps now carry a 20-minute per-package budget (the compat suite and
    # the race run), so the job ceiling has to clear both plus setup and vet.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python reference runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install frozen Python reference
        run: |
          python -m venv .tools/venv
          .tools/venv/bin/python -m pip install --upgrade pip
          .tools/venv/bin/python -m pip install -e ./upstream/nanobot

      - name: Download modules
        run: go mod download

      - name: Build canonical binary
        run: go build ./cmd/haosbot

      - name: Build with production tags
        run: go build -tags sqlite_fts5 ./cmd/haosbot

      # The compat package drives the frozen Python reference through ~17
      # subprocesses, so it is the one package whose runtime is not seconds.
      # Measured on the dev host: 203 s warm, 244 s under -race, and 736 s in a
      # cold run contended by sibling suites. go test's default budget is 10
      # minutes per package, which that worst case exceeds — and when it is
      # exceeded the report is "panic: test timed out", naming whichever test
      # happened to be running rather than the one that was slow. Give the
      # suite an explicit budget so the outcome is a pass or a real timeout.
      - name: Unit and differential tests
        run: go test -count=1 -timeout 20m ./...

      # The production binary is built with -tags sqlite_fts5 (MicroGraphRAG
      # needs SQLite FTS5), but the untagged run above skips every test that
      # opens a store, so the retrieved-memory path was never exercised in CI.
      # A silent no-op lived there: Search with a non-zero options struct
      # disabled every engine because micrographrag's normalizeSearchOptions
      # does not copy the Enable* flags. These packages are the ones that open a
      # store; they are the ones that must run tagged.
      - name: Tests with production tags
        run: go test -tags sqlite_fts5 -count=1 ./internal/agent/... ./internal/memory/... ./cmd/...

      - name: Race detector
        run: go test -race -count=1 -timeout 20m ./...

      - name: Vet
        run: go vet ./...

      - name: Shuffle internal tests
        run: go test -shuffle=on -count=3 ./internal/...

  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install analyzers
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Download modules
        run: go mod download

      - name: Staticcheck
        run: staticcheck ./...

      - name: Govulncheck
        run: govulncheck ./...
