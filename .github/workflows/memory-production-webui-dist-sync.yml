name: Temporary Memory Production WebUI dist sync

on:
  push:
    branches: [memory-production-hardening-v2]

permissions:
  contents: write

jobs:
  build-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: memory-production-hardening-v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Build WebUI
        working-directory: webui
        run: |
          npm ci
          npm run build
      - name: Commit generated bundle
        run: |
          if git diff --quiet -- internal/api/webui/next; then
            echo "Bundle already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/api/webui/next
          git commit -m "build(webui): sync production memory dashboard bundle"
          git push origin HEAD:memory-production-hardening-v2
