# staticcheck configuration.
#
# "inherit" keeps staticcheck's DEFAULT check set — writing "all" here would
# additionally enable the non-default style checks (ST1000 package comments,
# ST1003 naming, ST1021 doc comments), which is not what CI runs today.
#
# ST1005 ("error strings should not be capitalized") is disabled deliberately:
# this port mirrors the frozen Python reference's error and exception text
# verbatim, because ./compat compares message strings against what the reference
# produces. Restyling those messages for Go conventions would turn reference
# parity into a false failure, so the check does not apply here.
checks = ["inherit", "-ST1005"]
